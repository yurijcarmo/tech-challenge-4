apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-grafana-dashboard
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-ecosystem-health.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Cluster CPU Usage",
          "description": "Percentual médio de CPU utilizada nos nós do cluster.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval])))",
              "legendFormat": "CPU",
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Cluster Memory Usage",
          "description": "Percentual de memória usada nos nós do cluster.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)))",
              "legendFormat": "Memory",
              "range": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running Application Pods",
          "description": "Quantidade de pods em execução nos cinco namespaces da aplicação.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Running\",namespace=~\"auth-service|flag-service|targeting-service|evaluation-service|analytics-service\"})",
              "legendFormat": "Pods",
              "range": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Available Application Replicas",
          "description": "Soma das réplicas disponíveis dos deployments dos microsserviços.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=~\"auth-service|flag-service|targeting-service|evaluation-service|analytics-service\"})",
              "legendFormat": "Replicas",
              "range": true
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP Request Rate by Service",
          "description": "Taxa de requisições HTTP por segundo, agrupada pelo nome do microsserviço.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service_name) (rate({__name__=~\".*togglemaster_http_server_requests.*\"}[$__rate_interval]))",
              "legendFormat": "{{service_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "HTTP 5xx Error Percentage by Service",
          "description": "Percentual de respostas HTTP 5xx. A linha de 5% corresponde ao limite do alerta do auth-service.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never"
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (service_name) (rate({__name__=~\".*togglemaster_http_server_requests.*\",http_response_status_code=~\"5..\"}[$__rate_interval])) / clamp_min(sum by (service_name) (rate({__name__=~\".*togglemaster_http_server_requests.*\"}[$__rate_interval])), 0.001)",
              "legendFormat": "{{service_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "HTTP P95 Latency by Service",
          "description": "Percentil 95 da duração das requisições HTTP.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate({__name__=~\".*togglemaster_http_server_request_duration.*_bucket\"}[$__rate_interval])))",
              "legendFormat": "{{service_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Application Logs in Real Time",
          "description": "Logs centralizados dos cinco microsserviços, consultados no Loki.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{k8s_namespace_name=~\"auth-service|flag-service|targeting-service|evaluation-service|analytics-service\"}",
              "queryType": "range",
              "editorMode": "code"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "togglemaster",
        "observability",
        "kubernetes"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m"
        ]
      },
      "timezone": "browser",
      "title": "ToggleMaster - Ecosystem Health",
      "uid": "togglemaster-ecosystem-health",
      "version": 1,
      "weekStart": ""
    }
