apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-service-config
  namespace: targeting-service
data:
  PORT: "8003"
  AUTH_SERVICE_URL: "http://auth-service.auth-service.svc.cluster.local:8001"
  OTEL_SERVICE_NAME: "targeting-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
